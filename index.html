<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football Steph - Portale Ufficiale Torneo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- BARRA SUPERIORE -->
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="brand">
        <span class="trophy-icon">🏆</span>
        <div>
          <h1 id="tournament-title">CARICAMENTO TORNEO...</h1>
          <p id="tournament-subtitle">Portale Ufficiale Risultati, Classifiche & Statistiche</p>
        </div>
      </div>
    </div>

    <!-- SOTTO-SCHEDE DI NAVIGAZIONE -->
    <nav class="sub-tabs">
      <button class="tab-pill" data-tab="partite">TABELLONE</button>
      <button class="tab-pill" data-tab="marcatori">MARCATORI</button>
      <button class="tab-pill" data-tab="squadre">SQUADRE</button>
    </nav>
  </header>

<!-- CONTENUTO PRINCIPALE -->
  <main class="main-container">
    <div id="loading-state" class="loading-box">
      <div class="spinner"></div>
      <p>Caricamento tabellone in corso...</p>
    </div>

    <!-- 1. SEZIONE TABELLONE KNOCKOUT -->
    <section id="tab-tabellone" class="tab-section active-section" style="display: none;">
      <div id="champion-banner-container"></div>
      <div id="bracket-container"></div>
    </section>

   <!-- 2. SEZIONE MARCATORI -->
    <section id="tab-marcatori" class="tab-section" style="display: none;">
      <h2 class="section-heading">CLASSIFICA MARCATORI</h2>
      <div class="card-table">
        <table class="steph-table">
          <thead>
            <tr>
              <th class="col-pos">POS</th>
              <th class="col-team">GIOCATORE</th>
              <th class="col-pt">GOL</th>
              <th class="col-ass">ASS</th>
            </tr>
          </thead>
          <tbody id="scorers-table-body"></tbody>
        </table>
      </div>
    </section>

    <!-- 3. SEZIONE SQUADRE & ROSE -->
    <section id="tab-squadre" class="tab-section" style="display: none;">
      <h2 class="section-heading">SQUADRE ISCRITTE</h2>
      <div id="teams-container" class="teams-grid"></div>
    </section>
  </main>

  <!-- MODALE 1: DETTAGLIO PARTITA (GIOCATA O DA GIOCARE) -->
  <div id="match-modal" class="modal-overlay" style="display: none;">
    <div class="modal-sheet">
      <div class="modal-header">
        <span id="modal-match-meta" class="modal-meta"></span>
        <button class="modal-close" onclick="closeMatchModal()">✕</button>
      </div>

      <!-- SCOREBOARD HEADER -->
      <div id="modal-score-box" class="modal-score-box"></div>

      <!-- CONTENUTO SE PARTITA DA GIOCARE -->
      <div id="modal-scheduled-view" style="display: none;"></div>

      <!-- CONTENUTO SE PARTITA GIOCATA (CRONACA A SINISTRA, PAGELLE A DESTRA) -->
      <div id="modal-played-view" style="display: none;">
        <div class="modal-tabs">
          <button id="btn-tab-cronaca" class="modal-tab-btn active" onclick="switchMatchModalTab('cronaca')">
            📜 Cronaca
          </button>
          <button id="btn-tab-pagelle" class="modal-tab-btn" onclick="switchMatchModalTab('pagelle')">
            👥 Formazioni & Voti
          </button>
        </div>

        <div id="modal-tab-cronaca" class="modal-tab-body"></div>
        <div id="modal-tab-pagelle" class="modal-tab-body" style="display: none;"></div>
      </div>
    </div>
  </div>

  <!-- MODALE 2: SCHEDA GIOCATORE STILE FUT + STATS TORNEO -->
  <div id="player-modal" class="modal-overlay" style="display: none;">
    <div class="modal-sheet player-sheet">
      <div class="modal-header">
        <span class="modal-meta">SCHEDA ATLETA</span>
        <button class="modal-close" onclick="closePlayerModal()">✕</button>
      </div>
      <div id="player-card-content"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
